<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#E31E24">
    <title>SwimTimes - Lausanne Aquatique</title>
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
    --primary:#E31E24;
    --primary-dark:#B01519;
    --green-400:#4ade80;
    --yellow-400:#facc15;
    /* Surfaces plus sombres que le fond rouge : le texte blanc y garde un contraste AA (≥ 4,5:1) */
    --surface:rgba(0,0,0,.15);
    --surface-strong:rgba(0,0,0,.25);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);min-height:100vh;color:#fff;line-height:1.5}
.header{background:rgba(0,0,0,.2);padding:8px 12px 8px 16px;min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.header-brand{display:flex;align-items:center;gap:12px;min-width:0}
.header-logo img{height:28px;display:block}
.header-title{font-weight:700;font-size:18px;white-space:nowrap}
.header-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
.header-btn{width:44px;height:44px;border-radius:50%;border:none;background:none;color:#fff;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.header-btn:hover{background:rgba(255,255,255,.15)}
.header-btn[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.header-btn[aria-disabled=true]:hover{background:none}
.header-btn:focus-visible,.header-avatar:focus-visible{outline:2px solid #fff;outline-offset:2px}
.header-avatar{width:44px;height:44px;background:var(--surface-strong);border:2px solid rgba(255,255,255,.6);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;cursor:pointer;margin-left:4px}
.header-avatar:empty{display:none}
.header-avatar:hover{background:rgba(0,0,0,.35)}
@media(max-width:340px){.header-title{display:none}}
.swimmer-popup{position:fixed;top:64px;right:16px;z-index:200;animation:fadeIn .2s ease}
.swimmer-popup-content{max-width:calc(100vw - 32px);background:rgba(30,30,30,.95);backdrop-filter:blur(10px);border-radius:16px;padding:20px;min-width:260px;box-shadow:0 10px 40px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1)}
.swimmer-popup-name{font-size:18px;font-weight:700;margin-bottom:4px;padding-right:36px;overflow-wrap:anywhere}
.swimmer-popup-meta{font-size:13px;opacity:.8;margin-bottom:12px;overflow-wrap:anywhere}
.swimmer-popup-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;padding:12px 0;border-top:1px solid rgba(255,255,255,.1)}
.swimmer-popup-stat-value{font-size:18px;font-weight:700}
.swimmer-popup-stat-label{font-size:10px;opacity:.75}
.swimmer-popup-id{font-size:11px;opacity:.75;margin-top:8px}
.swimmer-popup-close{position:absolute;top:4px;right:4px;width:44px;height:44px;background:none;border:none;color:#fff;opacity:.6;cursor:pointer;font-size:18px}
.swimmer-popup-close:hover{opacity:1}
.nav{display:flex;border-bottom:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.1)}
.nav-tab{flex:1;padding:14px 8px;text-align:center;background:0 0;border:none;color:#fff;font-size:14px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px;opacity:.85}
.nav-tab:hover{background:rgba(255,255,255,.1)}
.nav-tab.active{background:rgba(255,255,255,.15);opacity:1;border-bottom:2px solid #fff}
.nav-tab svg{width:18px;height:18px}
.main{max-width:500px;margin:0 auto;padding:16px;padding-bottom:80px}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--surface);border-radius:16px;padding:20px;margin-bottom:16px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.5px;opacity:.9;margin-bottom:6px}
.form-input,.form-select{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.5);background:var(--surface);color:#fff;font-size:18px}
.form-input:focus,.form-select:focus{outline:2px solid #fff;outline-offset:2px;border-color:#fff}
.form-input::placeholder{color:rgba(255,255,255,.75)}
.form-select option{background:#B01519;color:#fff}
.form-hint{font-size:12px;opacity:.9;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:12px;border:none;font-size:16px;font-weight:600;cursor:pointer;width:100%}
.btn-primary{background:#fff;color:var(--primary)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{background:var(--surface);color:#fff;border:1px solid rgba(255,255,255,.5)}
.profile-avatar{width:80px;height:80px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:32px}
.profile-avatar-small{width:56px;height:56px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.help-box{background:var(--surface-strong);border-radius:12px;padding:16px;margin-top:4px}
.help-box ol{padding-left:20px;font-size:13px;opacity:.9}
.help-box li{margin-bottom:8px}
.help-box a{color:#fff}
.error-box{background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:14px;margin-bottom:16px;font-size:14px}
.selectors-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.pb-display{background:var(--surface);border-radius:12px;padding:16px;margin-bottom:16px}
.pb-display.empty{background:var(--surface)}
.pb-label{font-size:12px;opacity:.9;margin-bottom:4px}
.pb-time{font-size:32px;font-family:"SF Mono",Monaco,monospace;font-weight:700}
.times-table{background:var(--surface);border-radius:12px;overflow:hidden}
.times-table table{width:100%;border-collapse:collapse}
.times-table th{background:rgba(0,0,0,.2);padding:12px;text-align:left;font-size:11px;text-transform:uppercase;opacity:.9}
.times-table td{padding:14px 12px;border-top:1px solid rgba(255,255,255,.1)}
.times-table tr.olympic{background:var(--surface-strong);box-shadow:inset 4px 0 0 var(--yellow-400)}
.comp-name-solo{font-weight:500}
.comp-cat{font-size:13px}
.comp-limit{font-family:"SF Mono",Monaco,monospace;opacity:.9;margin-top:2px}
.fina-small{font-size:12px;opacity:.9}
/* Points FINA sous un écart coloré : la couleur porte déjà la hiérarchie, pas d'opacité en plus */
.diff-qualified .fina-small,.diff-close .fina-small,.diff-far .fina-small{opacity:1}
.time-mono{font-family:"SF Mono",Monaco,monospace}
.diff-qualified{color:#86efac}
.diff-close{color:#fde047}
.diff-far{color:#fecaca}
.status-icon{font-size:22px}
.pb-icon-cell{font-size:22px;text-align:center}
.times-table th:nth-child(2),.times-table th:nth-child(3),.times-table th:nth-child(4){text-align:center}
.times-table td:nth-child(2){text-align:center}
.times-table td:nth-child(3){text-align:center;font-family:"SF Mono",Monaco,monospace;font-size:13px}
.times-table td:nth-child(4){text-align:center;font-weight:600}
.table-footer{text-align:center;font-size:12px;padding:12px}
.progress-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px}
.progress-card{border-radius:12px;padding:16px;text-align:center;background:var(--surface-strong);border-top:4px solid transparent}
.progress-card.green{border-top-color:var(--green-400)}
.progress-card.orange{border-top-color:#fb923c}
.progress-card.yellow{border-top-color:var(--yellow-400)}
.progress-value{font-size:32px;font-weight:700}
.progress-label{font-size:12px;opacity:.9}
.section-title{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:12px}
.qualification-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qualification-item{background:rgba(74,222,128,.2);border-radius:10px;padding:10px}
.qualification-event{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.qualification-level{font-size:11px;opacity:.9}
.progress-table{background:var(--surface);border-radius:12px;overflow:hidden}
.progress-table table{width:100%;border-collapse:collapse}
.progress-table th{background:rgba(0,0,0,.2);padding:10px;text-align:left;font-size:11px;text-transform:uppercase;opacity:.9}
.progress-table td{padding:12px 10px;border-top:1px solid rgba(255,255,255,.1)}
.progress-table th:nth-child(3),.progress-table th:nth-child(4){text-align:center}
.progress-table td:nth-child(3),.progress-table td:nth-child(4){text-align:center}
.pb-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pb-item{background:var(--surface);border-radius:10px;padding:10px}
.pb-item-event{font-size:11px;opacity:.9}
.pb-item-time{font-family:"SF Mono",Monaco,monospace;font-weight:700}
.empty-state{text-align:center;padding:40px 20px}
.empty-icon{width:64px;height:64px;background:rgba(255,255,255,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px}
.footer{text-align:center;font-size:11px;opacity:.9;padding:20px}
.loading{display:inline-block;width:20px;height:20px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Configuration du profil (US-002) */
.setup-screen{display:none}
.setup-active .setup-screen{display:block;animation:fadeIn .3s ease}
.setup-active .nav,.setup-active .tab-content,.setup-active .header-actions{display:none!important}
/* Paramètres (US-005) */
.settings-screen{display:none}
.settings-active .settings-screen{display:block;animation:fadeIn .3s ease}
.settings-active .nav,.settings-active .tab-content{display:none!important}
.settings-active #header-settings{background:rgba(255,255,255,.2)}
.screen-header{display:flex;align-items:center;gap:8px;margin:0 0 16px -10px}
.screen-header h1{font-size:22px}
.btn-back{width:44px;height:44px;border-radius:50%;border:none;background:none;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-back:hover{background:rgba(255,255,255,.15)}
.btn-back:focus-visible{outline:2px solid #fff;outline-offset:2px}
.card-title{font-size:13px;text-transform:uppercase;letter-spacing:.5px;opacity:.9;margin-bottom:12px}
.settings-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:12px}
.settings-row span:first-child{opacity:.9}
.settings-row span:last-child{text-align:right}
.btn[aria-disabled=true]{opacity:.6;cursor:not-allowed}
.btn-danger{background:rgba(0,0,0,.25);color:#fff;border:1px solid rgba(255,255,255,.4)}
.danger-zone{margin-top:32px;padding-top:24px;border-top:1px solid rgba(255,255,255,.2)}
.badge-soon{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-strong)}
.records-details summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center;gap:8px;list-style:none}
.records-details summary::-webkit-details-marker{display:none}
.records-details summary::after{content:"▾";margin-left:auto;transition:transform .2s}
.records-details[open] summary::after{transform:rotate(180deg)}
.records-details[open] summary{margin-bottom:12px}
.setup-intro{text-align:center;padding:8px 0 20px}
.setup-intro h1,.setup-title{font-size:24px;margin-bottom:8px}
.setup-title{margin-bottom:16px}
.setup-privacy{font-size:12px;text-align:center;margin-top:12px}
.btn+.btn{margin-top:12px}
.form-section-title{font-size:13px;opacity:.9;margin-bottom:12px}
.form-input--mono{font-family:"SF Mono",Monaco,monospace}
.form-input--invalid{border:2px solid #fff}
.field-error{background:rgba(0,0,0,.25);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:13px}
.segmented{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--surface);border:1px solid rgba(255,255,255,.5)}
.segmented--invalid{border:2px solid #fff}
.segmented__option{position:relative}
.segmented__option input{position:absolute;opacity:0;width:1px;height:1px}
.segmented__option span{display:flex;min-height:44px;align-items:center;justify-content:center;border-radius:9px;font-size:16px;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.segmented__option input:checked+span{background:#fff;color:var(--primary)}
.segmented__option input:focus-visible+span{outline:2px solid #fff;outline-offset:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:calc(100% - 32px);background:rgba(30,30,30,.95);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:0 10px 40px rgba(0,0,0,.4);z-index:300;opacity:0;pointer-events:none;transition:opacity .2s}
.toast--visible{opacity:1}
.identity{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.identity__text{flex:1;min-width:0}
.identity__name{font-size:20px;font-weight:700;overflow-wrap:anywhere}
.identity__meta{font-size:14px;opacity:.9;overflow-wrap:anywhere}
.identity__meta--small{font-size:12px;margin-top:2px}
.records-details{margin-top:16px}
.notice{background:var(--surface-strong);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:14px}
.empty-state__text{font-size:14px}
.pb-time__state{font-size:14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-weight:400}
.screen-header .setup-title{margin-bottom:0}
.btn-link{background:none;border:none;color:#fff;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:12px 0;min-height:44px}
.btn-link:focus-visible{outline:2px solid #fff;outline-offset:2px}
.notice p{margin-bottom:4px}
.notice .btn-link{padding:8px 0}
.help-box p{font-size:13px;margin-top:8px}
.help-box code,.help-box__example{font-family:"SF Mono",Monaco,monospace}
.help-box mark{background:#fff;color:var(--primary-dark);padding:0 2px;border-radius:3px}
.field-status{font-size:13px;margin-top:6px}
.field-status:empty{display:none}
.field-warning{background:var(--surface-strong);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:13px}
.field-warning:empty{padding:0;margin:0;background:none}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.form-input--flash{animation:flash .4s ease}
@keyframes flash{from{background:rgba(255,255,255,.35)}}
.dialog{margin:auto;border:none;border-radius:16px;padding:24px;width:calc(100% - 32px);max-width:400px;background:#1e1e1e;color:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.dialog::backdrop{background:rgba(0,0,0,.6)}
.dialog h2{font-size:20px;margin-bottom:8px}
.dialog p{font-size:15px;margin-bottom:20px}
.dialog__actions{display:flex;flex-direction:column;gap:12px}
.dialog__actions .btn+.btn{margin-top:0}
.dialog .btn-danger{background:var(--primary);border-color:var(--primary)}
.dialog .btn-danger:disabled{opacity:.45;cursor:not-allowed}
.dialog .btn-danger{transition:opacity .2s}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(max-width:480px){.dialog{margin:auto 0 0;width:100%;max-width:none;border-radius:16px 16px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:400px){.nav-tab span{display:none}.pb-time{font-size:28px}}
    </style>
</head>
<body>
    <header class="header">
        <div class="header-brand">
            <div class="header-logo"><img src="logo-lausanne-aquatique.png" alt="Lausanne Aquatique"></div>
            <div class="header-title">SwimTimes</div>
        </div>
        <div class="header-actions">
            <button type="button" id="header-sync" class="header-btn" onclick="handleSyncClick()"
                aria-disabled="true" aria-label="Synchroniser mes temps (disponible prochainement)"
                title="Synchronisation disponible prochainement">🔄</button>
            <button type="button" id="header-settings" class="header-btn" onclick="openSettings()"
                aria-label="Paramètres" aria-pressed="false" title="Paramètres">⚙️</button>
            <button type="button" id="header-avatar" class="header-avatar" onclick="toggleSwimmerPopup()"
                aria-label="Mon profil" aria-haspopup="dialog" aria-expanded="false" aria-controls="swimmer-popup"></button>
        </div>
    </header>
    <div id="swimmer-popup" class="swimmer-popup" role="dialog" aria-label="Mon profil" style="display:none">
        <div class="swimmer-popup-content" id="swimmer-popup-content"></div>
    </div>
    <nav class="nav">
        <button class="nav-tab active" data-tab="times" onclick="showTab('times')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Temps</span>
        </button>
        <button class="nav-tab" data-tab="progress" onclick="showTab('progress')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
            <span>Progression</span>
        </button>
    </nav>
    <main class="main">
        <div id="setup-screen" class="setup-screen"></div>
        <div id="settings-screen" class="settings-screen"></div>
        <div id="tab-times" class="tab-content active">
            <div class="selectors-grid">
                <select id="select-gender" class="form-select" onchange="updateTimesDisplay()"><option value="Female">👩 Femme</option><option value="Male">👨 Homme</option></select>
                <select id="select-pool" class="form-select" onchange="updateTimesDisplay()"><option value="50m">🏊 50m (GB)</option><option value="25m">🏊 25m (PB)</option></select>
                <select id="select-stroke" class="form-select" onchange="updateTimesDisplay()"><option value="Freestyle">Nage Libre</option><option value="Backstroke">Dos</option><option value="Breaststroke">Brasse</option><option value="Butterfly">Papillon</option><option value="Medley">4 Nages</option></select>
                <select id="select-distance" class="form-select" onchange="updateTimesDisplay()"><option value="50">50m</option><option value="100">100m</option><option value="200">200m</option></select>
            </div>
            <div id="pb-display" class="pb-display"><div class="pb-label">Mes Temps</div><div class="pb-time" id="pb-time">—</div></div>
            <div id="times-table" class="times-table"></div>
            <div class="table-footer">Du plus facile ⬆️ au plus difficile ⬇️</div>
        </div>
        <div id="tab-progress" class="tab-content">
            <div style="margin-bottom:16px">
                <select id="select-progress-pool" class="form-select" onchange="updateProgressDisplay()" style="width:100%">
                    <option value="50m">🏊 Grand Bassin (50m)</option>
                    <option value="25m">🏊 Petit Bassin (25m)</option>
                </select>
            </div>
            <div id="progress-content"></div>
        </div>
    </main>
    <footer class="footer">Lausanne Aquatique • Données SwimRankings.net • Temps limites Swiss Swimming 2025-2028</footer>
    <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title" aria-describedby="confirm-text"
        onkeydown="trapConfirmDialogFocus(event)">
        <h2 id="confirm-title"></h2>
        <p id="confirm-text"></p>
        <div id="confirm-error" role="alert"></div>
        <!-- Annuler en bas : un double tap qui ouvre la confirmation retombe sur Annuler -->
        <div class="dialog__actions">
            <button type="button" class="btn btn-danger" id="confirm-ok" onclick="handleConfirmDialogOk(event)"></button>
            <button type="button" class="btn btn-secondary" id="confirm-cancel" onclick="handleConfirmDialogCancel()"></button>
        </div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <!-- Version dans l'URL : à changer à chaque déploiement pour que les navigateurs ne gardent pas un ancien app.js en cache -->
    <script src="app.js?v=20261001"></script>
</body>
</html>
